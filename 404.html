<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina nu există — Vitrina cu Delicii</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap" rel="stylesheet">
  <style>
    :root { --walnut: #5a2a14; --cherry: #8e4421; --facade: #e6f0e6; --paper: #f7fbf6; --rose: #b8285f; --ink: #2b1a12; --ink-soft: #5e4a3f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--facade); color: var(--ink); font: 1.125rem/1.5 "Alegreya Sans", "Gill Sans", system-ui, sans-serif; }
    main { max-width: 26rem; text-align: center; background: var(--paper); border-radius: 14px; padding: 36px 24px 32px; box-shadow: 0 18px 40px -28px rgba(90, 42, 20, .45); }
    img { width: 200px; height: auto; margin: 0 auto 12px; display: block; }
    h1 { font: italic 500 2rem/1.15 "Bodoni Moda", Georgia, serif; color: var(--walnut); margin: 0 0 10px; }
    p { color: var(--ink-soft); margin: 0 0 22px; }
    a { display: inline-block; min-height: 48px; padding: 12px 24px; border-radius: 999px; background: var(--rose); color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #24408c; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo.png" alt="Vitrina cu Delicii" width="640" height="287">
    <h1>Pagina nu există</h1>
    <p>Adresa pe care ați deschis-o nu face parte din site. Meniul e pe pagina principală.</p>
    <a href="/">Vezi meniul</a>
  </main>
</body>
</html>
